# Machine-checkable инварианты прогонов (Статья 5 CONSTITUTION.md).
# Каждый behavior-changing коммит объявляет здесь инвариант; ops/invariants.py
# проверяет их по журналу и пишет вердикты в vault/runs/. Красный вердикт =
# Telegram-алерт (+ опционально safe_mode). Статус committed_not_live_validated
# снимается ТОЛЬКО зеленым вердиктом.
#
# Формат:
#   - id: INV-NNN
#     commit: <hash|pending>
#     description: человеческое описание
#     metric: SQL-выражение или именованная метрика из ops/invariants.py
#     window: {closed_trades: N} | {hours: N}
#     expect: условие
#     status: pending | green | red

invariants:
  - id: INV-001
    commit: pending
    description: "close_reason 'unknown' не встречается (v1: 76% unknown/manual)"
    metric: close_reason_unknown_count
    window: { closed_trades: 20 }
    expect: "== 0"
    status: pending

  - id: INV-002
    commit: pending
    description: "Ни один лосер не живет дольше max_loss_hold_seconds профиля"
    metric: loser_overhold_count
    window: { closed_trades: 20 }
    expect: "== 0"
    status: pending

  - id: INV-003
    commit: pending
    description: "Журнал и биржа сходятся: reconcile diff пуст"
    metric: reconcile_diff_rows
    window: { hours: 48 }
    expect: "== 0"
    status: pending

  # --- R1 (2026-10-16): автомат + блок H. Объявлено до деплоя (ст. 5 п. 1).
  - id: INV-004
    commit: pending
    description: "Ни один вход не нарушает кап R:R и диапазон стопа профиля по цене филла (блок H: BERA 0.23 у кнопки «Маркет»)"
    metric: entry_price_violations
    window: { closed_trades: 10 }
    expect: "== 0"
    status: pending

  - id: INV-005
    commit: pending
    description: "Автомат: закрытые сделки сверены с биржей без расхождений (вход -> SL/TP -> закрытие -> филлы)"
    metric: reconcile_diff_rows
    window: { closed_trades: 5 }
    expect: "== 0"
    status: pending

  # --- R3 (2026-10-16): резолвер counterfactuals v2. Только измерение — торговое поведение
  # не меняется; инвариант держит честность датасета когорт (v1: нет свечей -> expired_flat).
  - id: INV-006
    commit: pending
    description: "CF резолвера v2 с исходом (кроме no_data) имеют полное покрытие свечами окна от начала до бара исхода"
    metric: cf_v2_coverage_violations
    window: { hours: 48 }
    expect: "== 0"
    status: pending
