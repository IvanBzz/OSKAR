# Рабочие настройки OSKAR (не-конституционные, можно менять обычным коммитом
# с changelog-записью; конституционные лимиты — в caps.yaml).
#
# Дрейф конфига (ревью 2026-10-13): ключ, который не читает код, — ложная ручка.
# tests/unit/test_settings_drift.py валит сборку на любом нечитаемом ключе, кроме
# перечисленных в его UNIMPLEMENTED с причиной. Здесь они помечены «не подключен»:
# их изменение на поведение НЕ влияет.

mode: paper                        # paper (BingX VST) | live — live откроется только через гейт Фазы 5

execution:
  # Режим исполнения по умолчанию (если не переключен в боте /mode): auto | confirm.
  # auto — сделки ставятся без нажатия, ТОЛЬКО на paper/VST (Иван 2026-10-16: «пока что
  # запускаем автоматический режим»). Переключатель в боте сохраняется в журнале.
  default_mode: auto

exchange:
  id: bingx                        # не подключен: код только под BingX
  sandbox: true                    # true = VST (open-api-vst.bingx.com), реальные цены
  hedge_mode: true                 # не подключен: VST всегда hedge, positionSide зашит в адаптере
  adjust_for_time_difference: true # не подключен: зашит True в фабриках ccxt (Windows clock drift, урок v1)
  rate_limit_ms: 100               # не подключен: ccxt enableRateLimit с лимитом биржи по умолчанию
  # ключи ТОЛЬКО из .env: BINGX_API_KEY, BINGX_API_SECRET

scanner:
  universe: swap_usdt              # не подключен: все активные USDT-перпы зашиты (829 на 2026-08-26)
  quick_filter_top: 100            # не подключен: scan() идет по всему universe
  full_analysis_top: 20
  min_hourly_quote_volume_usd: 200000  # пол ликвидности (мемкоины с дутыми RSI-очками — мимо)
  min_opportunity_score: 50        # порог эскалации; калибровка shadow-фазы по живой пробе
                                   # (реальные кандидаты 13-55: объемный компонент редок);
                                   # пересмотр по counterfactual-когортам
  per_symbol_cooldown_seconds: 1800

detect:
  swing_length: 5                  # живая проба 2026-08-26 на 15м: swing=5 дает 8 кандидатов
                                   # на топ-10/300 баров, swing=10 — только 2 (слишком медленно)

api:
  host: 127.0.0.1                  # только loopback (127.0.0.1 | localhost), иначе отказ старта
  port: 8321                       # bind = single-instance lock; oskar panic/status идут сюда же

telegram:
  # токен и chat_id ТОЛЬКО из .env: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
  send_charts: true                # не подключен: карточка всегда с графиком, если он отрисовался

agents:                            # model_cmd не подключен (claude_cli зовет `claude -p` сам),
                                   # analyst не подключен (агента еще нет); бюджеты scout/trader читаются
  # Иван 2026-10-16: ускорение, больше реальных кейсов (было scout 30/6, trader 20)
  scout:  { model_cmd: "claude -p", daily_budget: 60, hourly_budget: 10 }
  trader: { model_cmd: "claude -p", daily_budget: 30 }
  analyst: { model_cmd: "claude -p", daily_budget: 3 }
  # Sentinel живет в Hermes, бюджет там

safe_mode:
  consecutive_errors: 3            # серия неудачных тиков shadow-потока -> safe_mode
  error_cooldown_minutes: 60       # НЕ РЕАЛИЗОВАН: safe_mode — защелка, автовыхода нет
  drawdown_pct: 10                 # просадка от пика equity, % -> стоп новых входов (risk/drawdown.py);
                                   # автоматически не снимается (урок v1): oskar drawdown-reset
  token_budget_floor_pct: 20       # НЕ РЕАЛИЗОВАН: бюджеты LLM — жесткие daily/hourly лимиты

ops:                               # фоновые задачи демона (core/ops_jobs.py, блок I 2026-10-16)
  digest_time: "21:00"             # дневная сводка в сигнальный бот (и /digest по запросу), HH:MM
  timezone: Europe/Moscow          # часовой пояс digest_time
  invariants_every_hours: 6        # прогон ops/invariants (первый — через 10 мин после старта);
                                   # red -> алерт, тот же red повторно — не чаще раза в 24 ч

journal:
  db_path: data/oskar.db           # от корня репо; читает демон (oskar sync diff пока зашит на этот путь)
  archive_before_run: true         # не подключен: архив журнала только при смене его схемы

knowledge:                         # не подключен: источники и лимит зашиты в knowledge/index.py и Scout
  library_path: vault/library
  max_prompt_tokens: 1500
