# ============================================================================
# КОНСТИТУЦИОННЫЕ КАПСЫ OSKAR
# ============================================================================
# Этот файл защищен CONSTITUTION.md (Статья 4): его sha256 закреплен там,
# и рантайм сверяет хеш при старте. Несовпадение = safe_mode + алерт.
#
# Изменение ЛЮБОГО значения требует процедуры поправки:
#   1. >= 60 закрытых сделок при текущих капсах с PF >= 1.3
#   2. Proposal-заметка в vault/proposals/ с evidence
#   3. 48 часов охлаждения
#   4. Двухшаговое подтверждение в Telegram
#   5. Обновление хеша в CONSTITUTION.md тем же коммитом
#
# Флага принудительной торговли НЕ СУЩЕСТВУЕТ и не будет существовать (запрещен в CI).
# ============================================================================

risk_per_trade_pct: 1.0        # максимальный риск на сделку, % от equity
max_total_exposure_pct: 5.0    # суммарная экспозиция по всем позициям, % от equity
max_leverage: 10               # абсолютный потолок левериджа (профили могут ниже, выше — никогда)
confidence_cap: 75             # потолок confidence любого агента до калибровки (урок v1: 75+ выигрывал 16.7%)
min_rr_fee_adjusted: 2.0       # минимальный R:R ПОСЛЕ вычета 2x round-trip fee
max_open_positions: 3          # одновременных позиций
