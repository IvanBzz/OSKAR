[project]
name = "oskar"
version = "0.1.0"
description = "OSKAR - Orchestrated System Kernel for Autonomous Reasoning / Adaptive Risk. Multi-agent trading system."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "ccxt>=4.0",
    "pandas>=2.0,<3.0",
    "pandas-ta>=0.3.14b0",
    "smartmoneyconcepts>=0.0.21",
    "pydantic>=2.5",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "mplfinance>=0.12.10b0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "rich>=13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
oskar = "oskar.cli:main"
oskard = "oskar.core.daemon:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oskar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "vst: integration tests against BingX VST (need API keys)",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
