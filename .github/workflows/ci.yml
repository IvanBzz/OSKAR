name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Constitution caps pin
        run: uv run oskar caps-verify

      - name: Tests (unit + replay, no VST)
        run: uv run pytest -m "not vst" -q
